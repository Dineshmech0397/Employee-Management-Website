version: "3.8"

services:
  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: employee-management-db.ci34os6yw0l8.us-east-1.rds.amazonaws.com
      DB_USER: admin
      DB_PASSWORD: adminadmin
      DB_NAME: employee_db

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
