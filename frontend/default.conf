server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests internally over Docker's network to the backend container
    location /employees {
        proxy_pass http://emp-backend:5000/employees;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/employees/(.+) {
        proxy_pass http://emp-backend:5000/employees/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
